[project]
name = "buy-the-dip"
version = "0.1.0"
description = "Forward test of the S&P 500 volatile-dip limit buy on Pepperstone cTrader"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "boto3>=1.34",
    "ctrader-open-api>=0.9.2",
    "protobuf>=3.20.1",
    "httpx>=0.28",
    "pandas>=2.2",
    "pyarrow>=17",
    "yfinance>=0.2.50",
    "exchange-calendars>=4.5",
    "lxml>=5",
    "cssselect>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=3.0.5.260914",
    "lxml-stubs>=0.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/btd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits a real external service with real credentials; run with -m integration",
]
addopts = "-m 'not integration'"
faulthandler_timeout = 30
filterwarnings = [
    # importing ctrader_open_api.messages runs the package __init__, which loads Twisted;
    # the client doesn't use Twisted's TLS, so its service_identity warning doesn't apply
    "ignore:You do not have a working installation of the service_identity module",
    "ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning:google.protobuf",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-local-folder = ["fake_ctrader", "bars"]

[tool.mypy]
strict = true
packages = ["btd"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "ctrader_open_api.*", "yfinance", "exchange_calendars"]
ignore_missing_imports = true
